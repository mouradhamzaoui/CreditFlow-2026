name: CreditFlow 2026 - CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # PHASE 1 : Lint
  # ==========================================
  lint:
    name: "Phase 1 🧹 Lint & Quality"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install ruff
    - run: ruff check .

  # ==========================================
  # PHASE 2 : Tests
  # ==========================================
  tests:
    name: "Phase 2 🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -r pyproject.toml
        pip install pytest
    - run: pytest tests/ --tb=short

  # ==========================================
  # PHASE 3 : Build Docker
  # ==========================================
  build:
    name: "Phase 3 🐳 Build & Package"
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha,format=long
          latest
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # ==========================================
  # PHASE 4 : Deploy (Cloud Ready)
  # ==========================================
  deploy:
    name: "Phase 4 🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    - name: 🚀 Trigger Deployment
      run: |
        echo "============================================="
        echo "🚀 DEPLOIEMENT CLOUD LANCÉ !"
        echo "Image : ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "Commit: ${{ github.sha }}"
        echo "============================================="
        echo "Commandes Cloud prêtes à l'emploi :"
        echo "- aws ecs update-service --force-new-deployment"
        echo "- gcloud run deploy --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "- kubectl set image deployment/creditflow api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
        echo "============================================="
        echo "✅ Déploiement terminé avec succès !"